name: Hermes (Claude)

# Autonomous coding track of the AI pipeline, powered by the Claude Agent SDK.
#   engineer  — plans, implements, and self-verifies (pnpm typecheck/lint/test/build)
#   reviewer  — read-only Evaluator; posts a PASS/NEEDS_CHANGES/BLOCKED verdict
#
# Sits alongside the Gemini track (ai-dev.yml); n8n picks this workflow when the
# issue carries the `ai:hermes` label. Same guardrails: PR -> develop only, no
# publish (no NPM_TOKEN / id-token), fork PRs never reach here (n8n gates that).
# See docs/hermes-pipeline.md.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number this run is associated with (numeric)"
        required: true
        type: string
      task_type:
        description: "plan | bugfix | feature | docs | test"
        required: true
        type: string
      prompt:
        description: "Seed prompt produced by n8n (see docs/ai-dev-prompt-template.md)"
        required: true
        type: string
      head_branch:
        description: "Existing branch to commit onto. Empty means ai/issue-<num> from develop."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: hermes-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  hermes:
    name: Hermes agent
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TASK_TYPE: ${{ inputs.task_type }}
        run: |
          if ! printf '%s' "$ISSUE_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "::error::issue_number must be numeric, got: $ISSUE_NUMBER"; exit 1
          fi
          case "$TASK_TYPE" in
            plan|bugfix|feature|docs|test) ;;
            *) echo "::error::task_type must be one of plan|bugfix|feature|docs|test, got: $TASK_TYPE"; exit 1 ;;
          esac

      - name: Resolve branch name
        id: set-branch
        env:
          HEAD: ${{ inputs.head_branch }}
          NUM: ${{ inputs.issue_number }}
        run: |
          if [ -n "$HEAD" ]; then
            echo "branch_name=$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "branch_name=ai/issue-$NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Switch to working branch
        env:
          BRANCH_NAME: ${{ steps.set-branch.outputs.branch_name }}
        run: |
          git config user.name  "scrolloop-ai[bot]"
          git config user.email "scrolloop-ai[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH_NAME" 2>/dev/null || true
          if git rev-parse --verify "origin/$BRANCH_NAME" >/dev/null 2>&1; then
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
            echo "Continuing on existing branch $BRANCH_NAME"
          else
            git checkout -B "$BRANCH_NAME"
            echo "Created new branch $BRANCH_NAME from develop"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install repo dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Hermes orchestrator dependencies (isolated)
        # --ignore-workspace: treat .github/hermes as a standalone project, not part
        # of the root pnpm workspace (packages/*, apps/*).
        run: pnpm install --dir .github/hermes --ignore-workspace

      - name: Prepare run directory
        env:
          SEED_PROMPT: ${{ inputs.prompt }}
        run: |
          mkdir -p .ai ".harness/${{ inputs.issue_number }}"
          # .ai is transient (seed prompt, diff, logs). .harness IS committed so
          # plan/summary/review become part of the PR diff.
          mkdir -p .git/info
          grep -qxF '.ai/' .git/info/exclude 2>/dev/null || echo '.ai/' >> .git/info/exclude
          printf '%s' "$SEED_PROMPT" > .ai/prompt-seed.txt
          echo "seed prompt: $(wc -c < .ai/prompt-seed.txt) bytes"

      - name: Run engineer (Claude Agent SDK)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HERMES_ISSUE_NUMBER: ${{ inputs.issue_number }}
          HERMES_TASK_TYPE: ${{ inputs.task_type }}
          HERMES_SEED_FILE: .ai/prompt-seed.txt
          HERMES_REPO: ${{ github.repository }}
        run: node .github/hermes/engineer.mjs

      - name: Commit changes
        id: commit
        run: |
          git reset .ai 2>/dev/null || true
          git add ".harness/${{ inputs.issue_number }}/"
          if [ "${{ inputs.task_type }}" != "plan" ]; then
            git add -A
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            git commit -m "ai(hermes): ${{ inputs.task_type }} for issue #${{ inputs.issue_number }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        env:
          BRANCH_NAME: ${{ steps.set-branch.outputs.branch_name }}
        run: |
          if ! git log develop..HEAD --oneline | grep -q .; then
            git commit --allow-empty -m "ai(hermes): ${{ inputs.task_type }} placeholder for issue #${{ inputs.issue_number }}"
          fi
          git push -u origin "$BRANCH_NAME" --force-with-lease

      - name: Build PR body
        if: steps.commit.outputs.changed == 'true'
        run: |
          N="${{ inputs.issue_number }}"
          REPORT=".harness/$N/summary.md"
          [ "${{ inputs.task_type }}" = "plan" ] && REPORT=".harness/$N/plan.md"
          {
            echo "Automated Hermes (Claude Agent SDK) run for issue #$N."
            echo ""
            echo "- task_type: \`${{ inputs.task_type }}\`"
            echo "- branch: \`${{ steps.set-branch.outputs.branch_name }}\`"
            echo "- track: Hermes (autonomous Claude agent)"
            echo ""
            if [ -f "$REPORT" ]; then cat "$REPORT"; fi
            echo ""
            echo "_Opened by the Hermes agent. A human must review and merge. The reviewer agent leaves a follow-up verdict comment._"
          } > .ai/pr-body.md

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.set-branch.outputs.branch_name }}
        run: |
          TITLE_PREFIX=""
          [ "${{ inputs.task_type }}" = "plan" ] && TITLE_PREFIX="[plan] "
          gh pr create \
            --base develop \
            --head "$BRANCH_NAME" \
            --title "${TITLE_PREFIX}ai(hermes): issue #${{ inputs.issue_number }} (${{ inputs.task_type }})" \
            --body-file .ai/pr-body.md \
            || gh pr edit "$BRANCH_NAME" --body-file .ai/pr-body.md

      # ---------------------------------------------------------- Evaluator
      - name: Compute diff vs develop
        if: steps.commit.outputs.changed == 'true' && inputs.task_type != 'plan'
        run: |
          git fetch origin develop --depth=200 2>/dev/null || git fetch origin develop
          git diff origin/develop...HEAD > .ai/diff.patch
          echo "diff size: $(wc -l < .ai/diff.patch) lines"

      - name: Run reviewer (Claude Agent SDK)
        if: steps.commit.outputs.changed == 'true' && inputs.task_type != 'plan'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HERMES_ISSUE_NUMBER: ${{ inputs.issue_number }}
          HERMES_TASK_TYPE: ${{ inputs.task_type }}
          HERMES_SEED_FILE: .ai/prompt-seed.txt
          HERMES_DIFF_FILE: .ai/diff.patch
          HERMES_REPO: ${{ github.repository }}
        run: node .github/hermes/reviewer.mjs

      - name: Commit and push review
        if: steps.commit.outputs.changed == 'true' && inputs.task_type != 'plan'
        env:
          BRANCH_NAME: ${{ steps.set-branch.outputs.branch_name }}
        run: |
          git add ".harness/${{ inputs.issue_number }}/review.md"
          if git diff --cached --quiet; then
            echo "No review changes to commit"
          else
            git commit -m "ai(hermes): reviewer verdict for issue #${{ inputs.issue_number }}"
            git push origin "$BRANCH_NAME" --force-with-lease
          fi

      - name: Post review as PR comment
        if: steps.commit.outputs.changed == 'true' && inputs.task_type != 'plan'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.set-branch.outputs.branch_name }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file ".harness/${{ inputs.issue_number }}/review.md"
            echo "Posted reviewer verdict to PR #$PR_NUMBER"
          else
            echo "::warning::No PR found for branch $BRANCH_NAME — review not commented"
          fi

      - name: Signal BLOCKED verdict
        if: steps.commit.outputs.changed == 'true' && inputs.task_type != 'plan'
        run: |
          REVIEW=".harness/${{ inputs.issue_number }}/review.md"
          if [ -f "$REVIEW" ] && grep -A1 '^## Verdict' "$REVIEW" | tail -n +2 | grep -q 'BLOCKED'; then
            echo "::error::Reviewer verdict is BLOCKED"
            exit 1
          fi
