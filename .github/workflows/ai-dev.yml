name: AI Dev

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number this run is associated with (numeric)'
        required: true
        type: string
      task_type:
        description: 'plan | bugfix | feature | docs | test'
        required: true
        type: string
      prompt:
        description: 'Rendered prompt produced by n8n (see docs/ai-dev-prompt-template.md)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-dev-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  ai-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH_NAME: ai/issue-${{ inputs.issue_number }}
    steps:
      - name: Validate inputs
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TASK_TYPE: ${{ inputs.task_type }}
        run: |
          if ! printf '%s' "$ISSUE_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "::error::issue_number must be numeric, got: $ISSUE_NUMBER"
            exit 1
          fi
          case "$TASK_TYPE" in
            plan|bugfix|feature|docs|test) ;;
            *)
              echo "::error::task_type must be one of plan|bugfix|feature|docs|test, got: $TASK_TYPE"
              exit 1
              ;;
          esac

      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exclude runtime artifacts from git
        run: |
          mkdir -p .git/info
          if ! grep -qxF '.ai/' .git/info/exclude 2>/dev/null; then
            echo '.ai/' >> .git/info/exclude
          fi

      - name: Create working branch
        run: |
          git config user.name  "scrolloop-ai[bot]"
          git config user.email "scrolloop-ai[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"

      - name: Write prompt to file
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          mkdir -p .ai
          printf '%s' "$PROMPT" > .ai/prompt.txt
          echo "Prompt length: $(wc -c < .ai/prompt.txt) bytes"

      - name: Run Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_TYPE: ${{ inputs.task_type }}
          # Comma-separated fallback chain. The CLI is tried with each model in
          # order; if a model hits HTTP 429 quota, the next one is tried. For
          # `plan` task_type we also fall back to a direct Gemini REST API call
          # which bypasses the CLI's internal model routing entirely.
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS || 'gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.0-flash-lite' }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        run: |
          set -e
          npm install -g @google/gemini-cli
          echo "::group::gemini version"
          gemini --version || true
          echo "::endgroup::"

          OUT_FILE=".ai/run.log"
          [ "$TASK_TYPE" = "plan" ] && OUT_FILE=".ai/plan.md"

          rc=1
          IFS=',' read -ra MODELS <<< "$GEMINI_MODELS"
          for model in "${MODELS[@]}"; do
            model="$(echo "$model" | xargs)"  # trim whitespace
            echo "::group::gemini CLI attempt: $model"
            set +e
            gemini --model "$model" --yolo --prompt "$(cat .ai/prompt.txt)" \
              > "$OUT_FILE" 2> .ai/gemini.err
            rc=$?
            set -e
            echo "exit: $rc"
            tail -n 20 .ai/gemini.err 2>/dev/null || true
            echo "::endgroup::"

            if [ $rc -eq 0 ]; then
              echo "succeeded with $model"
              break
            fi
            if grep -qE 'TerminalQuotaError|Quota exceeded|"code": ?429|status: ?429' .ai/gemini.err 2>/dev/null; then
              echo "::notice::$model hit quota; trying next model"
              continue
            fi
            echo "::warning::$model failed with non-quota error; will not retry other CLI models"
            break
          done

          # REST API fallback (plan-only). Bypasses gemini-cli entirely so the
          # CLI's internal calls to gemini-2.5-flash (used for tool routing /
          # summarization) cannot cause us to hit that model's 20-RPD ceiling.
          if [ $rc -ne 0 ] && [ "$TASK_TYPE" = "plan" ]; then
            echo "::notice::falling back to direct Gemini REST API for plan mode"
            for model in "${MODELS[@]}"; do
              model="$(echo "$model" | xargs)"
              echo "::group::REST API attempt: $model"
              body=$(jq -n --rawfile p .ai/prompt.txt '{contents:[{parts:[{text:$p}]}]}')
              http_code=$(curl -sS -o .ai/plan-raw.json -w '%{http_code}' \
                "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent" \
                -H "x-goog-api-key: $GEMINI_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$body" || echo "000")
              echo "HTTP $http_code"
              if [ "$http_code" = "200" ]; then
                jq -r '.candidates[0].content.parts[0].text // empty' .ai/plan-raw.json > "$OUT_FILE"
                if [ -s "$OUT_FILE" ]; then
                  rc=0
                  echo "REST API succeeded with $model"
                  echo "::endgroup::"
                  break
                fi
              fi
              jq -r '.error.message // .' .ai/plan-raw.json 2>/dev/null | head -3 || true
              echo "::endgroup::"
            done
          fi

          # Plan mode is read-only: revert any incidental file edits.
          if [ "$TASK_TYPE" = "plan" ]; then
            git checkout -- . 2>/dev/null || true
            git clean -fd -e .ai 2>/dev/null || true
          fi

          if [ $rc -ne 0 ]; then
            echo "::error::all Gemini attempts (CLI + REST fallback) failed"
            echo "::group::stdout tail"
            tail -n 60 "$OUT_FILE" 2>/dev/null || echo "(no stdout)"
            echo "::endgroup::"
            exit $rc
          fi

      - name: Verify
        id: verify
        run: |
          set -eo pipefail
          mkdir -p .ai
          : > .ai/verify.md
          {
            echo "## Verification"
            echo ""
          } >> .ai/verify.md
          FAILED=0
          for cmd in "pnpm typecheck" "pnpm lint" "pnpm test" "pnpm build"; do
            script="${cmd#pnpm }"
            if pnpm run | grep -qE "^ *${script} *"; then
              {
                echo "### \`$cmd\`"
                echo '```'
              } >> .ai/verify.md
              rc=0
              $cmd >> .ai/verify.md 2>&1 || rc=$?
              {
                echo '```'
                echo "exit: $rc"
                echo ""
              } >> .ai/verify.md
              [ "$rc" -eq 0 ] || FAILED=1
            else
              {
                echo "### \`$cmd\` - skipped (no script)"
                echo ""
              } >> .ai/verify.md
            fi
          done
          cat .ai/verify.md
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more verification scripts failed. See .ai/verify.md."
            exit 1
          fi

      - name: Commit changes
        id: commit
        run: |
          git reset .ai || true
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "ai: address issue #${{ inputs.issue_number }} (${{ inputs.task_type }})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.commit.outputs.changed == 'true' || inputs.task_type == 'plan'
        run: |
          if ! git log develop..HEAD --oneline | grep -q .; then
            git commit --allow-empty -m "ai: plan for issue #${{ inputs.issue_number }}"
          fi
          git push -u origin "$BRANCH_NAME" --force-with-lease

      - name: Build PR body
        if: steps.commit.outputs.changed == 'true' || inputs.task_type == 'plan'
        id: body
        run: |
          {
            echo "Automated run for issue #${{ inputs.issue_number }}."
            echo ""
            echo "- task_type: \`${{ inputs.task_type }}\`"
            echo "- branch: \`${{ env.BRANCH_NAME }}\`"
            echo ""
            if [ -f .ai/plan.md ]; then
              echo "## Plan"
              echo ""
              cat .ai/plan.md
              echo ""
            fi
            if [ -f .ai/verify.md ]; then
              cat .ai/verify.md
            fi
            echo ""
            echo "_This PR was opened by the AI dev workflow. A human must review and merge._"
          } > .ai/pr-body.md

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true' || inputs.task_type == 'plan'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE_PREFIX=""
          if [ "${{ inputs.task_type }}" = "plan" ]; then
            TITLE_PREFIX="[plan] "
          fi
          gh pr create \
            --base develop \
            --head "$BRANCH_NAME" \
            --title "${TITLE_PREFIX}ai: issue #${{ inputs.issue_number }} (${{ inputs.task_type }})" \
            --body-file .ai/pr-body.md \
            || gh pr edit "$BRANCH_NAME" --body-file .ai/pr-body.md
